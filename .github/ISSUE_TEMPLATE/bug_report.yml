name: "🐛 Reporte de Error (Bug Report)"
description: "Crea un reporte de error para ayudarnos a solucionar un fallo o comportamiento inesperado"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este problema. Por favor proporciona la información detallada para que podamos reproducirlo.
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica de forma clara y concisa en qué consiste el problema observado.
      placeholder: Describe qué ocurrió y por qué no es el comportamiento esperado...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Lista los pasos exactos para reproducir el error.
      placeholder: |
        1. Iniciar servidor Modbus TCP en puerto 502...
        2. Configurar registros Holding en dirección 0...
        3. Enviar petición Modbus Function 03 desde maestro...
        4. Observar el error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería haber ocurrido normalmente.
      placeholder: El servidor debería responder con el código de función 03 y el valor esperado sin excepciones.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema Operativo
      options:
        - "Windows 11"
        - "Windows 10"
        - "Otro (especificar en información adicional)"
    validations:
      required: true
  - type: dropdown
    id: execution_mode
    attributes:
      label: Modo de Ejecución
      options:
        - "Ejecutable compilado (.exe)"
        - "Código fuente (Python / venv)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Información adicional / Logs
      description: Adjunta capturas de pantalla, fragmentos del sniffer o trazas de la consola si están disponibles.
