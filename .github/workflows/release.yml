name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run verification tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --clean ModbusSlavePro.spec

      - name: Verify Executable Generated
        shell: powershell
        run: |
          if (-not (Test-Path "dist\ModbusSlavePro.exe")) {
            Write-Error "Error: dist\ModbusSlavePro.exe no fue generado."
            exit 1
          }
          $size = (Get-Item "dist\ModbusSlavePro.exe").Length / 1MB
          Write-Host ("ModbusSlavePro.exe generado exitosamente: {0:N2} MB" -f $size)

      - name: Create GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ModbusSlavePro.exe
          generate_release_notes: true
          draft: false
          prerelease: false
